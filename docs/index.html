<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식품 법령 개정 모니터</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #1c1f1e;
      color: #e8ede9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 1.6rem; color: #b7e4c7; margin-bottom: 12px; }
    p { color: #9aab9e; font-size: 0.95rem; line-height: 1.7; max-width: 400px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #363b38;
      border-top-color: #52b788;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>⚖️ 식품 법령 개정 모니터</h1>
  <div class="spinner"></div>
  <p>첫 번째 GitHub Actions가 실행되면<br>이 페이지가 자동으로 채워집니다.</p>
  <p style="margin-top:16px; font-size:0.82rem;">Actions 탭 → <strong>주간 식품 법령 수집</strong> → Run workflow</p>
</body>
</html>
