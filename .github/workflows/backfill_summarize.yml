name: 과거 데이터 요약 백필 (일일)

# 2026-07-23: 2023~2026년 과거 데이터 198건을 한 번에 백필하면서 Gemini 무료
# 티어 일일 호출 한도(실측 20회)를 넘어서는 문제가 생김. summarize_items.py가
# 당해년도는 전부, 그 이전 항목은 하루 10건만 처리하도록 자체적으로 제한하므로,
# 이 워크플로가 매일 돌면서 조금씩 밀린 과거 항목을 처리한다. 다 끝나면
# needs_update() 대상이 없어서 매번 빠르게 아무 것도 안 하고 종료된다.
on:
  schedule:
    - cron: '13 11 * * *'  # 매일 UTC 11:13 = KST 20:13 (주간 수집(월 09:27 KST)과 겹치지 않도록)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Gemini API로 과거 항목 순차 요약(하루 최대 10건)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize_items.py

      - name: HTML 사이트 빌드
        run: python scripts/build_site.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: 과거 데이터 요약 백필 $(date +'%Y-%m-%d')"
          git push
