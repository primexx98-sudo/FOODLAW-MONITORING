name: 주간 식품 법령 수집

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 09:00 KST (= UTC 00:00)
  workflow_dispatch:       # 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 법령 데이터 수집
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: python scripts/collect_all.py

      - name: Claude API로 신규 항목 요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize_items.py

      - name: HTML 사이트 빌드
        run: python scripts/build_site.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: 자동 수집 $(date +'%Y-%m-%d')"
          git push
